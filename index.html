<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameForge AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #050508;
  --bg2: #0e0e16;
  --bg3: #161620;
  --border: rgba(120,120,255,0.12);
  --border2: rgba(120,120,255,0.25);
  --purple: #7c6fff;
  --cyan: #00e5ff;
  --text: #e8e8f0;
  --text2: #8888aa;
  --text3: #44445a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* GRID BG */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(124,111,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,111,255,0.04) 1px,transparent 1px);
  background-size:50px 50px;
}
.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(90px);z-index:0;}
.orb1{width:500px;height:500px;background:radial-gradient(rgba(124,111,255,0.1),transparent 70%);top:-100px;left:-100px;}
.orb2{width:400px;height:400px;background:radial-gradient(rgba(0,229,255,0.07),transparent 70%);bottom:-100px;right:-100px;}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;
  background:rgba(5,5,8,0.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:700;}
.logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  display:grid;place-items:center;font-size:15px;
  box-shadow:0 0 18px rgba(124,111,255,0.4);
}
.logo span{color:var(--purple);}
.ai-dot-wrap{display:flex;align-items:center;gap:6px;font-family:'Space Mono';font-size:10px;color:#00ff88;}
.ai-dot{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* MAIN */
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:90px 2rem 4rem;}

/* STEP FLOW */
.step{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:1.5rem;margin-bottom:1rem;
  position:relative;overflow:hidden;transition:border-color 0.3s;
}
.step::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),transparent);
  opacity:0.5;
}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;}
.step-num{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;
}
.step-header h2{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text2);font-family:'Space Mono';}

/* UPLOAD */
.upload-zone{
  border:1.5px dashed rgba(124,111,255,0.3);border-radius:10px;
  padding:2.5rem;text-align:center;cursor:pointer;transition:all 0.3s;
  background:rgba(124,111,255,0.03);position:relative;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--purple);background:rgba(124,111,255,0.08);}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2;}
.upload-icon{font-size:3rem;margin-bottom:12px;display:block;}
.upload-zone h3{font-size:16px;font-weight:600;margin-bottom:6px;}
.upload-zone p{font-size:12px;color:var(--text3);font-family:'Space Mono';}
.upload-zone .hint{
  display:inline-block;margin-top:12px;
  font-family:'Space Mono';font-size:9px;letter-spacing:2px;color:var(--purple);
  border:1px solid rgba(124,111,255,0.3);padding:4px 12px;border-radius:4px;
}

/* THUMBNAILS ROW */
.thumbs-row{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;
}
.thumb-item{
  position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;
  border:1px solid var(--border2);flex-shrink:0;
}
.thumb-item img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-remove{
  position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:10px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background 0.2s;
}
.thumb-remove:hover{background:#e05a4a;}
.thumb-more{
  width:72px;height:72px;border-radius:8px;border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:'Space Mono';font-size:10px;color:var(--text3);gap:3px;
  background:var(--bg3);
}
.file-count{
  margin-top:10px;font-family:'Space Mono';font-size:11px;
  color:#00ff88;background:rgba(0,255,136,0.08);
  border:1px solid rgba(0,255,136,0.2);padding:6px 12px;border-radius:6px;
  display:none;text-align:center;
}

/* COLORS */
.colors-grid{display:flex;gap:8px;flex-wrap:wrap;}
.color-btn{
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all 0.2s;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);
  position:relative;
}
.color-btn:hover{transform:scale(1.12);}
.color-btn.on{border-color:var(--purple);box-shadow:0 0 12px rgba(124,111,255,0.5);}
.color-btn.on::after{
  content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:rgba(255,255,255,0.9);font-weight:700;
}

/* SLIDER */
.slider-row{display:flex;align-items:center;gap:14px;}
.slider-label{font-family:'Space Mono';font-size:11px;color:var(--text3);min-width:40px;}
.slider-val{font-family:'Space Mono';font-size:13px;color:var(--cyan);font-weight:700;min-width:50px;text-align:right;}
input[type=range]{
  flex:1;height:4px;appearance:none;background:var(--border2);border-radius:2px;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:16px;height:16px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(124,111,255,0.4);
}

/* GENERATE BUTTON */
.btn-gen{
  width:100%;padding:16px;
  background:linear-gradient(135deg,var(--purple),#5a4fff);
  color:#fff;border:none;border-radius:10px;
  font-family:'Space Grotesk';font-size:15px;font-weight:700;letter-spacing:1px;
  cursor:pointer;transition:all 0.3s;
  box-shadow:0 4px 28px rgba(124,111,255,0.35);
  position:relative;overflow:hidden;
}
.btn-gen::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  transform:translateX(-100%);transition:transform 0.6s;
}
.btn-gen:hover::before{transform:translateX(100%);}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(124,111,255,0.5);}
.btn-gen:disabled{opacity:0.3;cursor:not-allowed;transform:none;}

/* PROGRESS */
.prog-wrap{margin-top:14px;display:none;}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px;width:0%;transition:width 0.3s;box-shadow:0 0 6px var(--cyan);}
.prog-txt{font-family:'Space Mono';font-size:10px;color:var(--text3);text-align:center;}

/* OUTPUT */
.output-section{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:1.5rem;margin-top:1rem;display:none;
  position:relative;overflow:hidden;
}
.output-section::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:0.5;
}
.output-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.output-header h2{font-family:'Space Mono';font-size:12px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;}
.btn-zip{
  padding:8px 20px;
  background:transparent;color:var(--cyan);
  border:1px solid rgba(0,229,255,0.35);border-radius:8px;
  font-family:'Space Grotesk';font-size:12px;font-weight:600;
  cursor:pointer;transition:all 0.3s;letter-spacing:1px;
}
.btn-zip:hover{background:rgba(0,229,255,0.08);box-shadow:0 0 16px rgba(0,229,255,0.2);}
.btn-zip:disabled{opacity:0.4;cursor:not-allowed;}

/* CANVAS GRID */
.canvas-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}
.citem{
  border:1px solid var(--border);border-radius:10px;overflow:hidden;
  transition:all 0.25s;cursor:pointer;background:var(--bg3);position:relative;
}
.citem:hover{border-color:var(--purple);transform:translateY(-4px);box-shadow:0 10px 30px rgba(124,111,255,0.2);}
.citem:hover .citem-overlay{opacity:1;}
.citem-overlay{
  position:absolute;inset:0;background:rgba(5,5,8,0.6);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.25s;
}
.dl-btn-over{
  padding:8px 20px;background:linear-gradient(135deg,var(--purple),var(--cyan));
  color:#fff;border:none;border-radius:6px;font-family:'Space Grotesk';
  font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;
}
.citem canvas{width:100%;display:block;}
.citem-name{
  padding:7px 10px;border-top:1px solid var(--border);
  font-family:'Space Mono';font-size:10px;color:var(--text3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<header>
  <div class="logo">
    <div class="logo-icon">⬡</div>
    Frame<span>Forge</span>
  </div>
  <div class="ai-dot-wrap">
    <div class="ai-dot"></div>
    AI READY
  </div>
</header>

<main>

  <!-- STEP 1: UPLOAD -->
  <div class="step" id="step1">
    <div class="step-header">
      <div class="step-num">1</div>
      <h2>Select Your Designs</h2>
    </div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <span class="upload-icon">🖼</span>
      <h3>Drop images here</h3>
      <p>PNG · JPG · Select 100+ at once</p>
      <span class="hint">CLICK OR DRAG & DROP</span>
    </div>
    <div class="file-count" id="fileCount"></div>
    <div class="thumbs-row" id="thumbsRow"></div>
  </div>

  <!-- STEP 2: FRAME COLOR -->
  <div class="step" id="step2" style="opacity:0.4;pointer-events:none;">
    <div class="step-header">
      <div class="step-num">2</div>
      <h2>Frame Color</h2>
    </div>
    <div class="colors-grid" id="colorGrid"></div>
  </div>

  <!-- STEP 3: FRAME SIZE -->
  <div class="step" id="step3" style="opacity:0.4;pointer-events:none;">
    <div class="step-header">
      <div class="step-num">3</div>
      <h2>Frame Border Size</h2>
    </div>
    <div class="slider-row">
      <span class="slider-label">SLIM</span>
      <input type="range" id="frameSlider" min="0" max="100" value="40" oninput="updateSlider(this.value)">
      <span class="slider-label">THICK</span>
      <span class="slider-val" id="sliderVal">Medium</span>
    </div>
  </div>

  <!-- STEP 4: GENERATE -->
  <div class="step" id="step4" style="opacity:0.4;pointer-events:none;">
    <div class="step-header">
      <div class="step-num">4</div>
      <h2>Generate Mockups</h2>
    </div>
    <button class="btn-gen" id="genBtn" onclick="generate()">⚡ &nbsp; GENERATE ALL MOCKUPS</button>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <p class="prog-txt" id="progTxt">Processing...</p>
    </div>
  </div>

  <!-- OUTPUT -->
  <div class="output-section" id="outputSection">
    <div class="output-header">
      <h2>Generated Mockups — <span id="outCount" style="color:var(--cyan);">0</span> files</h2>
      <button class="btn-zip" id="zipBtn" onclick="downloadZip()">↓ Download ZIP</button>
    </div>
    <div class="canvas-grid" id="canvasGrid"></div>
  </div>

</main>

<script>
// ── STATE ──
let files = [];
let frameColor = '#111111';
let frameSize = 40; // 0-100
let canvases = [];

// ── FRAME COLORS ──
const COLORS = [
  {hex:'#111111', name:'Black'},
  {hex:'#ffffff', name:'White'},
  {hex:'#8B6910', name:'Gold'},
  {hex:'#909090', name:'Silver'},
  {hex:'#7a5230', name:'Wood'},
  {hex:'#1a3a5c', name:'Navy'},
  {hex:'#2d4a2d', name:'Forest'},
  {hex:'#5a1a1a', name:'Burgundy'},
];

// Build color grid
const cg = document.getElementById('colorGrid');
COLORS.forEach(c => {
  const btn = document.createElement('div');
  btn.className = 'color-btn' + (c.hex === frameColor ? ' on' : '');
  btn.style.background = c.hex;
  if(c.hex === '#ffffff') btn.style.boxShadow = 'inset 0 0 0 1px #ccc';
  btn.title = c.name;
  btn.onclick = () => {
    frameColor = c.hex;
    cg.querySelectorAll('.color-btn').forEach(x => x.classList.remove('on'));
    btn.classList.add('on');
  };
  cg.appendChild(btn);
});

// ── SLIDER ──
function updateSlider(v) {
  frameSize = parseInt(v);
  const labels = ['Ultra Slim','Slim','Medium','Thick','Bold'];
  const idx = Math.floor(v / 25);
  document.getElementById('sliderVal').textContent = labels[Math.min(idx, 4)];
}

// ── FILE INPUT ──
document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));
const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('drag'); });
uz.addEventListener('dragleave', () => uz.classList.remove('drag'));
uz.addEventListener('drop', e => { e.preventDefault(); uz.classList.remove('drag'); handleFiles(e.dataTransfer.files); });

function handleFiles(flist) {
  const newFiles = Array.from(flist).filter(f => f.type.startsWith('image/'));
  if (!newFiles.length) return;
  files = [...files, ...newFiles];
  renderThumbs();
  document.getElementById('fileCount').textContent = '✓  ' + files.length + ' files ready';
  document.getElementById('fileCount').style.display = 'block';
  // Unlock steps
  ['step2','step3','step4'].forEach(id => {
    const el = document.getElementById(id);
    el.style.opacity = '1'; el.style.pointerEvents = 'auto';
    el.style.transition = 'opacity 0.4s';
  });
}

function renderThumbs() {
  const row = document.getElementById('thumbsRow');
  row.innerHTML = '';
  const show = files.slice(0, 5);
  show.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const wrap = document.createElement('div'); wrap.className = 'thumb-item';
    const img = document.createElement('img'); img.src = url;
    const rm = document.createElement('button'); rm.className = 'thumb-remove'; rm.innerHTML = '×';
    rm.onclick = e => { e.stopPropagation(); files.splice(i, 1); renderThumbs(); document.getElementById('fileCount').textContent = '✓  ' + files.length + ' files ready'; };
    wrap.appendChild(img); wrap.appendChild(rm);
    row.appendChild(wrap);
  });
  if (files.length > 5) {
    const more = document.createElement('div'); more.className = 'thumb-more';
    more.innerHTML = '<span style="font-size:18px">+</span><span>'+( files.length - 5)+'</span>';
    row.appendChild(more);
  }
}

// ── DRAW ──
function loadImg(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = ev => { const i = new Image(); i.onload = () => res(i); i.src = ev.target.result; };
    r.readAsDataURL(file);
  });
}

function drawFrame(canvas, img) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Background = same as frame color but lighter wall
  const wallColors = {
    '#111111': '#e8e4de', '#ffffff': '#e0dbd5',
    '#8B6910': '#ece8e0', '#909090': '#e4e4e8',
    '#7a5230': '#ece4d8', '#1a3a5c': '#dce4ec',
    '#2d4a2d': '#dce8dc', '#5a1a1a': '#ece0e0',
  };
  const floorColors = {
    '#111111': '#c9b99a', '#ffffff': '#c0b090',
    '#8B6910': '#c8b480', '#909090': '#b8b8c0',
    '#7a5230': '#b89870', '#1a3a5c': '#a8b8c8',
    '#2d4a2d': '#a8b898', '#5a1a1a': '#b89898',
  };

  const wc = wallColors[frameColor] || '#e8e4de';
  const fc = floorColors[frameColor] || '#c9b99a';

  // Wall
  const flH = Math.round(H * 0.28);
  const wg = ctx.createLinearGradient(0,0,0,H-flH);
  wg.addColorStop(0, wc);
  wg.addColorStop(1, shadeColor(wc, -15));
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H - flH);

  // Floor
  const fg = ctx.createLinearGradient(0, H-flH, 0, H);
  fg.addColorStop(0, shadeColor(fc, -20));
  fg.addColorStop(1, fc);
  ctx.fillStyle = fg; ctx.fillRect(0, H - flH, W, flH);

  // Floor/wall line
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0, H-flH-1, W, 3);

  // Frame dimensions
  const fW = Math.round(W * 0.68);
  const fH = Math.round(H * 0.74);
  const fX = Math.round((W - fW) / 2);
  const fY = Math.round(H * 0.025);

  // Border thickness from slider (0-100 → 1% to 5% of frame width)
  const bpx = Math.round(fW * (0.008 + (frameSize / 100) * 0.055));
  // Mat = fixed generous white border
  const mpx = Math.round(fW * 0.07);

  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = Math.round(W * 0.018);
  ctx.shadowOffsetX = Math.round(W * 0.004);
  ctx.shadowOffsetY = Math.round(W * 0.01);
  ctx.fillStyle = frameColor; ctx.fillRect(fX, fY, fW, fH);
  ctx.restore();

  // Frame border
  ctx.fillStyle = frameColor; ctx.fillRect(fX, fY, fW, fH);

  // Gold sheen
  if (frameColor === '#8B6910') {
    ctx.save();
    ctx.strokeStyle = 'rgba(240,200,80,0.45)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(fX+2, fY+2, fW-4, fH-4);
    ctx.restore();
  }
  // Silver sheen
  if (frameColor === '#909090') {
    ctx.save();
    const sg = ctx.createLinearGradient(fX, fY, fX+fW, fY);
    sg.addColorStop(0,'rgba(255,255,255,0.08)'); sg.addColorStop(0.5,'rgba(255,255,255,0.25)'); sg.addColorStop(1,'rgba(255,255,255,0.08)');
    ctx.fillStyle = sg; ctx.fillRect(fX, fY, fW, fH); ctx.restore();
  }
  // White frame inner line
  if (frameColor === '#ffffff') {
    ctx.save(); ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1;
    ctx.strokeRect(fX+0.5, fY+0.5, fW-1, fH-1); ctx.restore();
  }

  // White mat
  ctx.fillStyle = '#f5f5f2';
  ctx.fillRect(fX+bpx, fY+bpx, fW-bpx*2, fH-bpx*2);

  // Image area
  const ix = fX+bpx+mpx, iy = fY+bpx+mpx;
  const iw = fW-bpx*2-mpx*2, ih = fH-bpx*2-mpx*2;
  ctx.fillStyle = '#fff'; ctx.fillRect(ix, iy, iw, ih);

  if (img) {
    ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
    const sc = Math.min(iw/img.width, ih/img.height);
    const dw = img.width*sc, dh = img.height*sc;
    ctx.drawImage(img, ix+(iw-dw)/2, iy+(ih-dh)/2, dw, dh);
    ctx.restore();
  }

  // Floor reflection
  const rY = fY + fH, rH = Math.round(fH * 0.06);
  ctx.save(); ctx.globalAlpha = 0.25;
  ctx.translate(fX, rY+rH); ctx.scale(1,-1);
  ctx.drawImage(canvas, fX, fY, fW, rH, 0, 0, fW, rH);
  ctx.restore();
  const rg = ctx.createLinearGradient(0, rY, 0, rY+rH);
  const [r,g,b] = hexRgb(fc);
  rg.addColorStop(0, `rgba(${r},${g},${b},0)`);
  rg.addColorStop(1, `rgba(${r},${g},${b},1)`);
  ctx.fillStyle = rg; ctx.fillRect(fX, rY, fW, rH+2);
}

function shadeColor(hex, pct) {
  const [r,g,b] = hexRgb(hex);
  const f = 1 + pct/100;
  return `rgb(${Math.min(255,Math.max(0,Math.round(r*f)))},${Math.min(255,Math.max(0,Math.round(g*f)))},${Math.min(255,Math.max(0,Math.round(b*f)))})`;
}
function hexRgb(hex) {
  hex = hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

// ── GENERATE ──
async function generate() {
  if (!files.length) return;
  // HD output: 1600x2133
  const W = 1600, H = 2134;
  const t0 = Date.now();
  canvases = [];

  document.getElementById('progWrap').style.display = 'block';
  document.getElementById('outputSection').style.display = 'block';
  document.getElementById('canvasGrid').innerHTML = '';
  document.getElementById('zipBtn').disabled = true;
  document.getElementById('genBtn').disabled = true;

  for (let i = 0; i < files.length; i++) {
    await new Promise(r => setTimeout(r, 0));
    const img = await loadImg(files[i]);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    drawFrame(c, img);
    const name = files[i].name.replace(/\.[^.]+$/, '');
    canvases.push({ canvas: c, name });

    // Preview tile
    const wrap = document.createElement('div'); wrap.className = 'citem';
    const fc2 = document.createElement('canvas');
    const sc = 220 / W;
    fc2.width = Math.round(W*sc); fc2.height = Math.round(H*sc);
    fc2.getContext('2d').drawImage(c, 0, 0, fc2.width, fc2.height);
    const ov = document.createElement('div'); ov.className = 'citem-overlay';
    const ovb = document.createElement('button'); ovb.className = 'dl-btn-over'; ovb.textContent = '↓ Save';
    const ci = i;
    ovb.onclick = e => { e.stopPropagation(); dlOne(ci); };
    ov.appendChild(ovb);
    const nm = document.createElement('div'); nm.className = 'citem-name'; nm.textContent = name;
    wrap.appendChild(fc2); wrap.appendChild(ov); wrap.appendChild(nm);
    wrap.onclick = () => dlOne(ci);
    document.getElementById('canvasGrid').appendChild(wrap);

    const pct = Math.round(((i+1)/files.length)*100);
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('progTxt').textContent = (i+1) + ' / ' + files.length + ' done — ' + pct + '%';
    document.getElementById('outCount').textContent = i+1;
  }

  document.getElementById('progTxt').textContent = '✓ All ' + canvases.length + ' HD mockups ready!';
  document.getElementById('zipBtn').disabled = false;
  document.getElementById('genBtn').disabled = false;
}

function dlOne(i) {
  const a = document.createElement('a');
  a.download = 'mockup_' + canvases[i].name + '.jpg';
  a.href = canvases[i].canvas.toDataURL('image/jpeg', 0.95);
  a.click();
}

async function downloadZip() {
  const btn = document.getElementById('zipBtn');
  btn.disabled = true; btn.textContent = '⏳ Building ZIP...';
  const zip = new JSZip(), folder = zip.folder('Mockups');
  for (let i = 0; i < canvases.length; i++) {
    const b64 = canvases[i].canvas.toDataURL('image/jpeg', 0.95).split(',')[1];
    folder.file('mockup_' + canvases[i].name + '.jpg', b64, { base64: true });
    await new Promise(r => setTimeout(r, 0));
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 3 } });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'Mockups_HD.zip'; a.click();
  URL.revokeObjectURL(a.href);
  btn.disabled = false; btn.textContent = '↓ Download ZIP';
}
